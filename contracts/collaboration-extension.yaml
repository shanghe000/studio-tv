    "title": "Studio TV local collaboration extension",
    "version": "1.1.0",
    "description": "IMPLEMENTED source contract. IPAC gates application tv.access; local project/team ACL gates resources. Project permission ETags are independent of graph revisions. Members must be active users already federated through Feishu. No public links or ownership transfer. Actor identity never becomes storageOwnerId. Explicit team publications and independent project asset imports are included below. Team asset success responses are raw DTOs; original membership/project/team operations keep their existing success envelope. Publishing never changes private source ownership; project imports copy actual bytes and remap all references without writing the target graph."
  },
