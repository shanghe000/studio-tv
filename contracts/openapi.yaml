components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 真实短期accessToken，15分钟；验证签名/issuer/audience/exp，拒绝alg:none。
    RefreshCookie:
      type: apiKey
      in: cookie
      name: __Host-rhtv_refresh
      description: HttpOnly;Secure;SameSite=Lax;Path=/。仅刷新/退出使用，单次轮换；最长30日。
  parameters:
    TeamId:
      name: X-Team-Id
      in: header
      required: false
      description: 省略=个人空间；提供时必须校验用户是团队成员。私有资源仍核验实际归属。
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID。用户+团队+operationId作用域；相同键/请求只产生一次副作用；不同请求409。
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 强 ETag，例如 "3"；冲突HTTP412+VERSION_CONFLICT，不覆盖新版本。
      schema:
        type: string
        pattern: ^"[0-9]+"$
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 与服务端会话或预登录上下文绑定的同源token；用于cookie认证的refresh/logout。
      schema:
        type: string
        minLength: 32
        maxLength: 256
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    Locale:
      name: locale
      in: query
      schema:
        type: string
        enum:
        - zh-CN
        - en
        - ja
        - ko
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
      description: 不透明字符串；禁止 JSON 数字 ID。
    LocalizedText:
      type: object
      properties:
        zh-CN:
          type: string
          maxLength: 32000
        en:
          type: string
          maxLength: 32000
        ja:
          type: string
          maxLength: 32000
        ko:
          type: string
          maxLength: 32000
      minProperties: 1
      additionalProperties: false
    Money:
      type: object
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
      required:
      - currency
      - amount
      additionalProperties: false
      description: 十进制字符串，最多6位小数；禁止 float。币种结算精度由目录明确，成本先按6位账本精度向上舍入。
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
            - message
            additionalProperties: false
      required:
      - code
      - message
      - requestId
      - retryable
      - details
      additionalProperties: false
    Acknowledgement:
      type: object
      properties:
        accepted:
          type: boolean
      required:
      - accepted
      additionalProperties: false
    Deleted:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        deletedAt:
          type: string
          format: date-time
          pattern: Z$
          description: UTC RFC3339，以 Z 结尾。
      required:
      - id
      - deletedAt
      additionalProperties: false
    Membership:
      type: object
      properties:
        planCode:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        expiresAt:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
            description: UTC RFC3339，以 Z 结尾。
          - type: 'null'
        features:
          type: array
          items:
            type: string
      required:
      - planCode
      - name
      - expiresAt
      - features
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
          maxLength: 120
        avatarUrl:
          anyOf:
          - type: string
            format: uri
            pattern: ^https://
            maxLength: 4096
          - type: 'null'
        locale:
          type: string
          enum:
          - zh-CN
          - en
          - ja
          - ko
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        wallet:
          $ref: '#/components/schemas/Money'
        teamIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
      required:
      - id
      - displayName
      - avatarUrl
      - locale
      - memberships
      - wallet
      - teamIds
      additionalProperties: false
    Preferences:
      type: object
      properties:
        locale:
          type: string
          enum:
          - zh-CN
          - en
          - ja
          - ko
        defaultMode:
          type: string
          enum:
          - AGENT
          - IMAGE
          - VIDEO
          - MOTION_TRANSFER
        executionPolicy:
          type: string
          enum:
          - ASK
          - AUTO
        imageModelId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        videoModelId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        imageParams:
          type: object
          additionalProperties: true
        videoParams:
          type: object
          additionalProperties: true
      required: []
      additionalProperties: false
    AuthChallenge:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        expiresAt:
          type: string
          format: date-time
          pattern: Z$
          description: UTC RFC3339，以 Z 结尾。
        resendAfterSeconds:
          type: integer
          minimum: 0
      required:
      - id
      - expiresAt
      - resendAfterSeconds
      additionalProperties: false
    AuthChallengeRequest:
      type: object
      properties:
        channel:
          type: string
          enum:
          - EMAIL
          - SMS
        identifier:
          type: string
          minLength: 3
          maxLength: 254
        purpose:
          type: string
          enum:
          - SIGN_IN
      required:
      - channel
      - identifier
      - purpose
      additionalProperties: false
    SessionRequest:
      oneOf:
      - type: object
        properties:
          grantType:
            type: string
            enum:
            - PASSWORD
          email:
            type: string
            format: email
          password:
            type: string
            minLength: 8
            maxLength: 128
            writeOnly: true
        required:
        - grantType
        - email
        - password
        additionalProperties: false
      - type: object
        properties:
          grantType:
            type: string
            enum:
            - OTP
          challengeId:
            $ref: '#/components/schemas/Id'
          code:
            type: string
            pattern: ^\d{6}$
            writeOnly: true
        required:
        - grantType
        - challengeId
        - code
        additionalProperties: false
    OAuthExchangeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 4000
          writeOnly: true
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          writeOnly: true
        redirectUri:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 4096
        state:
          type: string
          minLength: 20
          maxLength: 256
      required:
      - code
      - codeVerifier
      - redirectUri
      - state
      additionalProperties: false
    OAuthAuthorizationRequest:
      type: object
      properties:
        redirectUri:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 4096
        codeChallenge:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        codeChallengeMethod:
          type: string
          enum:
          - S256
      required:
      - redirectUri
      - codeChallenge
      - codeChallengeMethod
      additionalProperties: false
    OAuthAuthorization:
      type: object
      properties:
        authorizationUrl:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 4096
        state:
          type: string
          minLength: 20
          maxLength: 256
        expiresAt:
          type: string
          format: date-time
          pattern: Z$
          description: UTC RFC3339，以 Z 结尾。
      required:
      - authorizationUrl
      - state
      - expiresAt
      additionalProperties: false
    Session:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 20
          readOnly: true
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 0
          const: 900
        user:
