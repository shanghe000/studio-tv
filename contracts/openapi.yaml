          anyOf:
          - &id001
            type: string
            minLength: 1
            maxLength: 128
            description: 必须属于当前model.invocationTypes；例如IMAGE_TO_VIDEO、VIDEO_EDIT。具体值由模型能力目录定义。
          - type: 'null'
      required:
      - projectId
      - mode
      - prompt
      - attachments
      - params
      - outputCount
      - executionPolicy
      additionalProperties: false
      description: 直接生成模式必须提供modelId+capabilityVersion且executionPolicy=AUTO；AGENT可由后端规划并选择ASK或AUTO。附件只接收本服务READY
        assetId，禁止任意URL。skillSelections中的子选项须属于该技能，skipPromptExpansion由后端技能目录解算。
      allOf:
      - if:
          properties:
            mode:
              enum:
              - IMAGE
              - VIDEO
              - MOTION_TRANSFER
          required:
          - mode
        then:
          required:
          - modelId
          - capabilityVersion
          - invocationType
          properties:
            modelId:
              $ref: '#/components/schemas/Id'
            capabilityVersion:
              type: string
              minLength: 1
            executionPolicy:
              type: string
              enum:
              - AUTO
            invocationType:
              type: string
              minLength: 1
              maxLength: 128
              description: 必须属于当前model.invocationTypes；例如IMAGE_TO_VIDEO、VIDEO_EDIT。具体值由模型能力目录定义。
