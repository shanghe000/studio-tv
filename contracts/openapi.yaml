  /generations/{generationId}/events:
    get:
      operationId: streamGenerationEvents
      tags:
      - Generations
      summary: SSE快照和状态更新
      description: 用带Bearer的fetch流，不把令牌写入URL。首连发送snapshot；事件至少投递一次，以id去重/revision判断新旧。事件保留24小时；游标过期发送stream.reset+完整快照。每15秒注释心跳；终态事件后关闭。断线不取消任务。
      parameters:
      - name: generationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: text/event-stream，event/data结构见GenerationEvent。
          headers:
            X-Request-Id:
              description: 本次服务端请求关联 ID；错误响应也返回。
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: evt_001

                event: generation.completed

                data: {"id":"evt_001","type":"generation.completed","generationId":"gen_001","revision":4,"occurredAt":"2026-10-03T00:01:00Z","snapshot":{"id":"gen_001","projectId":"prj_001","mode":"VIDEO","state":"SUCCEEDED","revision":4,"progress":1,"phase":null,"plan":null,"confirmationQuote":null,"outputs":[{"index":0,"state":"SUCCEEDED","assetId":"ast_result_001","error":null}],"billing":{"state":"SETTLED","authorized":{"currency":"USD","amount":"0.242000"},"reserved":{"currency":"USD","amount":"0"},"charged":{"currency":"USD","amount":"0.240000"},"released":{"currency":"USD","amount":"0.002000"},"refunded":{"currency":"USD","amount":"0"}},"error":null,"createdAt":"2026-10-03T00:00:00Z","updatedAt":"2026-10-03T00:01:00Z"}}


                '
        default:
