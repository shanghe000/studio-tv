openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: RHTV 自建后端 API 合同
  version: 1.0.0
  description: 为现有首页复刻提供新后端协议。JSON/OpenAPI为字段与接口唯一依据；README定义跨接口业务不变量。尚未实现任何真实后端。现有原站路径由兼容层映射，不直接透传原站接口。
servers:
- url: /api/v1
  description: 同源反向代理入口；开发配置可替换为本地后端origin
security:
- BearerAuth: []
tags:
- name: Auth
- name: Account
- name: Home
- name: Models
- name: Projects
- name: Assets
- name: Generations
- name: Content
- name: Notifications
- name: Billing
- name: Telemetry
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags:
      - Auth
      summary: 获取刷新/退出所需CSRF token
      description: ''
      parameters: []
      responses:
        '200':
          description: 成功；返回真实持久状态
          headers:
            X-Request-Id:
              description: 本次服务端请求关联 ID；错误响应也返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '412':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '501':
          $ref: '#/components/responses/ErrorResponse'
      security: []
  /auth/challenges:
    post:
      operationId: createSignInChallenge
      tags:
      - Auth
      summary: 发送邮箱或手机验证码
      description: ''
      parameters: []
      responses:
        '201':
          description: 成功；返回真实持久状态
          headers:
            X-Request-Id:
              description: 本次服务端请求关联 ID；错误响应也返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallengeResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '412':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '501':
          $ref: '#/components/responses/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
  /auth/sessions:
    post:
      operationId: createSession
      tags:
      - Auth
      summary: 邮箱密码或验证码登录
      description: 成功设置HttpOnly刷新cookie。验证码单次消费；账号存在与否不泄漏。
      parameters: []
      responses:
        '201':
          description: 成功；返回真实持久状态
          headers:
            X-Request-Id:
              description: 本次服务端请求关联 ID；错误响应也返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                code: 0
                message: OK
                requestId: req_example_001
                data:
                  accessToken: example-not-a-real-access-token
                  tokenType: Bearer
                  expiresIn: 900
                  user:
                    id: usr_001
                    displayName: Example User
                    avatarUrl: null
                    locale: zh-CN
                    memberships: []
                    wallet:
                      currency: USD
                      amount: '12.000000'
                    teamIds: []
        default:
          $ref: '#/components/responses/ErrorResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '412':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '501':
          $ref: '#/components/responses/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
            example:
              grantType: PASSWORD
              email: demo@example.com
              password: ExamplePassword123!
  /auth/oauth/google/authorization:
    post:
      operationId: startGoogleAuthorization
      tags:
      - Auth
      summary: 建立Google授权事务
      description: 服务端生成单次state并绑定S256 challenge、允许的redirectUri及浏览器HttpOnly事务cookie，10分钟过期。前端保留codeVerifier；不接受仅由前端自报的state。
      parameters: []
      responses:
        '201':
          description: 成功；返回真实持久状态
          headers:
            X-Request-Id:
              description: 本次服务端请求关联 ID；错误响应也返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '412':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '501':
          $ref: '#/components/responses/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizationRequest'
            example:
              redirectUri: https://app.example.com/auth/google/callback
              codeChallenge: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              codeChallengeMethod: S256
  /auth/oauth/google/exchange:
    post:
      operationId: exchangeGoogleCode
      tags:
      - Auth
      summary: 交换Google授权码
      description: 服务端核验PKCE、state、issuer、audience与允许的redirectUri；第三方密钥仅后端保存。
      parameters: []
      responses:
        '201':
          description: 成功；返回真实持久状态
          headers:
            X-Request-Id:
              description: 本次服务端请求关联 ID；错误响应也返回。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '412':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
        '501':
          $ref: '#/components/responses/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
