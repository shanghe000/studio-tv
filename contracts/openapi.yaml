      - generationId
      - planRevision
      - inputHash
      - capabilityVersion
      - maximumCost
      - lineItems
      - chargingPolicy
      - expiresAt
      - pricingVersion
      additionalProperties: false
      description: 最大可扣金额；费率/优惠快照绑定。ASK仅允许运行已报价规划阶段，执行阶段需计划报价再次确认；所有收费必须已获对应报价授权。INITIAL的generationId/planRevision为null；PLAN_EXECUTION二者必填。
      allOf:
      - if:
          properties:
            purpose:
              const: PLAN_EXECUTION
        then:
          properties:
            generationId:
              $ref: '#/components/schemas/Id'
            planRevision:
              type: integer
              minimum: 0
      - if:
          properties:
            purpose:
              const: INITIAL
        then:
          properties:
            generationId:
              type: 'null'
            planRevision:
              type: 'null'
