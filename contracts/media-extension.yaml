        ]
      },
      "MediaCommand": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "projectId": {
            "type": "string"
          },
          "nodeId": {
            "type": "string"
          },
          "operation": {
            "type": "string"
          },
          "operateType": {
            "type": "string"
          },
          "bizId": {
            "type": "string"
          },
          "canvasId": {
            "type": "string"
          },
          "bizType": {
            "enum": [
              "CANVAS"
            ]
          },
          "executor": {
            "enum": [
              "FFMPEG"
            ]
          },
          "spec": {
            "$ref": "#/components/schemas/MediaSpec"
          }
        },
        "required": [
          "projectId",
          "spec"
        ]
      },
      "MediaSpec": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "version": {
            "const": 1
          },
          "inputs": {
            "type": "array",
            "minItems": 1,
            "maxItems": 16,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "id": {
                  "type": "string"
                },
                "assetId": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "assetId"
              ]
            }
          },
          "tracks": {
            "type": "array",
            "minItems": 1,
            "maxItems": 2,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "type": {
                  "enum": [
                    "video",
                    "audio",
                    "split",
                    "compress"
                  ]
                },
                "clips": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 24,
                  "items": {
                    "$ref": "#/components/schemas/Clip"
                  }
                }
              },
              "required": [
                "type",
                "clips"
              ]
            }
          },
          "output": {
            "$ref": "#/components/schemas/MediaOutput"
          }
        },
        "required": [
          "inputs",
          "tracks"
        ]
      },
      "Clip": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "input": {
            "type": "string"
          },
          "trim": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "startMs": {
                "type": "integer",
                "minimum": 0,
                "maximum": 600000
              },
              "endMs": {
                "type": "integer",
                "minimum": 1,
                "maximum": 600000
              }
            },
            "required": [
              "startMs"
            ]
          },
          "crop": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "x": {
                "type": "integer",
                "minimum": 0
              },
              "y": {
                "type": "integer",
                "minimum": 0
              },
              "width": {
                "type": "integer",
                "minimum": 2,
                "maximum": 3840
              },
              "height": {
                "type": "integer",
                "minimum": 2,
                "maximum": 2160
              }
            },
            "required": [
              "x",
              "y",
              "width",
              "height"
            ]
          },
          "speed": {
            "type": "number",
            "minimum": 0.25,
            "maximum": 4
          },
          "reverse": {
            "type": "boolean"
          },
          "rotate": {
            "enum": [
              "0",
              "90",
              "180",
              "270"
            ]
          },
          "mirror": {
            "enum": [
              "horizontal",
              "vertical"
            ]
          }
        },
        "required": [
          "input"
        ]
      },
      "MediaOutput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "container": {
            "enum": [
              "mp4",
              "webm",
              "mov",
              "wav"
            ]
          },
          "fps": {
            "type": "integer",
            "minimum": 0,
            "maximum": 60
          },
          "width": {
            "type": "integer",
            "minimum": 0,
            "maximum": 3840
          },
          "height": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2160
          },
          "videoCodec": {
            "enum": [
              "h264",
              "libx264",
              "vp9",
              "libvpx-vp9"
            ]
          },
          "audioCodec": {
            "enum": [
              "aac",
              "opus",
              "pcm_s16le"
            ]
          },
          "bucket": {
            "const": "canvas"
          },
          "crf": {
            "type": "integer",
            "minimum": 18,
            "maximum": 40
          },
          "maxBytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 536870912
          },
          "preset": {
            "enum": [
              "veryfast",
              "fast",
              "medium"
            ],
            "description": "Applied encoder effort: H264 uses the exact preset; VP9 maps veryfast/fast/medium to cpu-used 8/4/2. Default fast. Video-only; WAV rejects this property."
          }
        },
        "required": [
          "container"
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "container": {
                  "const": "wav"
                }
              },
              "required": [
                "container"
              ]
            },
            "then": {
              "properties": {
                "preset": false,
                "crf": false,
                "videoCodec": false,
                "fps": {
                  "const": 0
                },
                "width": {
                  "const": 0
                },
                "height": {
                  "const": 0
                },
                "audioCodec": {
                  "const": "pcm_s16le"
                }
              }
            }
          }
        ]
      },
      "RenderCommand": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "fps": {
            "enum": [
              24,
              30,
              60
            ]
          },
          "quality": {
            "enum": [
              "draft",
              "standard",
              "high"
            ]
          },
          "format": {
            "enum": [
              "mp4",
              "webm",
              "mov"
            ]
          },
          "resolution": {
            "enum": [
              "1080p",
              "4k"
            ]
          },
          "composition": {
            "type": "string",
            "description": "An owned saved HTML workspace path, for example compositions/a.html; omitted selects index.html.",
            "maxLength": 512
          }
        },
        "required": [
          "fps",
          "quality",
          "format"
        ]
      },
      "Materialize": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "projectId": {
            "type": "string"
          },
          "family": {
            "type": "string"
          },
          "resourceId": {
            "type": "string"
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "path": {
            "type": "string",
            "description": "RFC6901 pointer into the exact persisted resource content, resolving to a registered local media reference."
          }
        },
        "required": [
          "family",
          "resourceId",
          "revision",
          "path"
        ]
      },
      "ElementTarget": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 200
          },
          "selector": {
            "type": "string",
            "maxLength": 1000
          },
          "selectorIndex": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10000
          }
        },
        "anyOf": [
          {
            "required": [
              "id"
            ]
          },
          {
            "required": [
              "selector"
            ]
          }
        ]
      },
      "EditOperation": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "type": {
            "enum": [
              "style",
              "attribute",
              "text",
              "remove"
            ]
          },
          "property": {
            "type": "string",
            "maxLength": 102
          },
          "value": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 65536
          }
        },
        "required": [
          "type"
        ]
      },
      "EditCommand": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "target": {
            "$ref": "#/components/schemas/ElementTarget"
          },
          "operations": {
            "type": "array",
