  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100000
      description: 默认1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: 默认20；节点历史最大20
    Search:
      name: keyword
      in: query
      schema:
        type: string
        maxLength: 300
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 32
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 36
        format: uuid
    LastEventId:
      name: Last-Event-ID
      in: header
      schema:
        type: string
        maxLength: 30
        pattern: ^[0-9]+$
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: 沿用v1错误包；所有访问校验owner和实时tv.access。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
