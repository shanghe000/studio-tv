      "post": {
        "operationId": "appendConversationUserMessage",
        "summary": "Append authorized USER TEXT/ASSET/selected skill without starting a model run",
        "x-implementation-status": "IMPLEMENTED",
        "security": [
          {
            "LocalBearer": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^\"[1-9][0-9]*\"$"
            },
            "description": "Positive strong conversation revision ETag. Missing428; malformed400; stale412 with current revision detail."
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "minLength": 36,
              "maxLength": 36
            },
            "description": "Hyphenated UUID, case normalized; scope verified owner+assistantAppendUserMessage+key. Canonical content, conversationId and frozen If-Match revision identify the request. Same key/request replays original201 message+receipt revision, even after later appends; changed input/path/precondition409. Every replay rechecks actual root/project/message ownership. Receipt+message+sequence+revision commit in one locked transaction."
          }
        ],
        "responses": {
          "400": {
            "description": "Invalid field/query/header; unknown or repeated query parameters are rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
