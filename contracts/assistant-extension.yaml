  "components": {
    "securitySchemes": {
      "LocalBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Verified Studio local session; host validates IPAC/session state and live tv.access before invoking module."
      }
    },
    "schemas": {
      "Conversation": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "createdAt": {
            "type": "string",
            "maxLength": 40,
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "maxLength": 40,
            "format": "date-time"
          },
          "projectId": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 200,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "hfProjectId": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 200,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "kind": {
            "type": "string",
            "enum": [
              "GLOBAL",
              "CANVAS",
              "HF"
            ]
          },
          "title": {
            "type": "string",
            "maxLength": 120
          }
        },
        "required": [
          "id",
          "revision",
          "createdAt",
          "updatedAt",
          "projectId",
          "hfProjectId",
          "kind",
          "title"
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "GLOBAL"
                }
              }
            },
            "then": {
              "properties": {
                "projectId": {
                  "type": "null"
                },
                "hfProjectId": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "CANVAS"
                }
              }
            },
            "then": {
              "required": [
                "projectId"
              ],
              "properties": {
                "projectId": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 200
                },
                "hfProjectId": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "HF"
                }
              }
            },
            "then": {
              "properties": {
                "projectId": {
                  "type": "null"
                }
              }
            }
          }
        ],
        "description": "Private persisted conversation. CANVAS binds an owned active canvas. HF optionally binds an owned active HyperFrames project."
      },
      "ConversationCreate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "GLOBAL",
              "CANVAS",
              "HF"
            ]
          },
          "projectId": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 200,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "hfProjectId": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 200,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ]
          },
          "title": {
            "type": "string",
            "maxLength": 120
          }
        },
        "required": [
          "kind",
          "title"
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "GLOBAL"
                }
              }
            },
            "then": {
              "properties": {
                "projectId": {
                  "type": "null"
                },
                "hfProjectId": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "CANVAS"
                }
              }
            },
            "then": {
              "required": [
                "projectId"
              ],
              "properties": {
                "projectId": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 200
                },
                "hfProjectId": {
                  "type": "null"
                }
              }
            }
          },
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "HF"
                }
              }
            },
            "then": {
              "properties": {
                "projectId": {
                  "type": "null"
                }
              }
            }
          }
        ],
        "description": "GLOBAL/CANVAS/HF are implemented. GLOBAL has no project binding; HF accepts optional owned hfProjectId. UUID receipt includes the validated body."
      },
      "ConversationResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "const": 0
          },
          "message": {
            "type": "string",
            "maxLength": 2000
          },
          "data": {
            "$ref": "#/components/schemas/Conversation"
          },
          "requestId": {
            "type": "string",
            "maxLength": 200
          }
        },
        "required": [
          "code",
          "message",
          "data",
          "requestId"
        ]
      },
      "ConversationPage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "records": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Conversation"
            },
            "maxItems": 100
          },
          "page": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100000
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "total": {
            "type": "integer",
            "minimum": 0
