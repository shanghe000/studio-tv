{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "Studio TV Assistant API Extension",
    "version": "1.3.0",
    "description": "Persisted owner GLOBAL/CANVAS/HF conversations, authorized USER TEXT/ASSET/selected skill writes, monotonic turn/message deletion and actual task/event client-tool absence query. Nine operations implemented by assistant module; legacy run metadata remains reserved here and production execution-backed routes are documented in execution-extension."
  },
  "x-default-unknown-path-status": 404,
  "paths": {
    "/api/v2/conversations": {
      "get": {
        "operationId": "listConversations",
        "summary": "List own active GLOBAL and Canvas conversations",
        "x-implementation-status": "IMPLEMENTED",
        "security": [
          {
            "LocalBearer": []
          }
        ],
        "parameters": [
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100000,
              "default": 1
            }
          },
          {
            "name": "size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "keyword",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 300
            },
            "description": "Trim outer whitespace; title or TEXT-message matching. SQL % and _ are literal."
          },
          {
            "name": "kind",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "GLOBAL",
                "CANVAS",
                "HF"
              ]
            },
            "description": "Optional exact type. HF501; blank/unknown/repeated400. GLOBAL cannot combine with project filters. CANVAS cannot combine with hfProjectId."
          },
          {
            "name": "projectId",
            "in": "query",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            },
            "description": "Filter Canvas roots by owned undeleted project; inaccessible explicit project404. Cannot combine with hfProjectId."
          },
          {
            "name": "hfProjectId",
            "in": "query",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            },
            "description": "Reserved HF filter returns501, unless contradictory/invalid filters return400 first."
          }
        ],
        "responses": {
          "400": {
            "description": "Invalid field/query/header; unknown or repeated query parameters are rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "No verified local identity",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Live tv.access denied",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Object missing or inaccessible to this owner",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable; retryable, access fails closed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "200": {
            "description": "Owned roots sorted by updatedAt descending then id; GLOBAL independent of project visibility",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConversationPageResponse"
                }
              }
            }
          },
          "501": {
            "description": "HF conversation persistence is RESERVED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "x-required-capability": "tv.access"
      },
      "post": {
        "operationId": "createConversation",
        "summary": "Create private GLOBAL or Canvas conversation",
        "x-implementation-status": "IMPLEMENTED",
        "security": [
          {
            "LocalBearer": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "minLength": 36,
              "maxLength": 36
            },
            "description": "Canonical hyphenated UUID, case normalized. Scope is verified owner+operation. Same key/hash returns original201 projection; different hash409; deleted root/project404. Root and receipt commit together."
          }
        ],
        "responses": {
          "400": {
            "description": "Invalid field/query/header; unknown or repeated query parameters are rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "No verified local identity",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Live tv.access denied",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Object missing or inaccessible to this owner",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable; retryable, access fails closed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "201": {
            "description": "New or idempotently replayed initial projection. ETag is quoted revision. GLOBAL has projectId/hfProjectId null.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ConversationResponse"
                }
              }
            }
          },
          "409": {
            "description": "IDEMPOTENCY_CONFLICT: same owner/key, different canonical request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "501": {
            "description": "HF conversation persistence is RESERVED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "x-required-capability": "tv.access",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ConversationCreate"
              }
            }
          }
        }
      }
    },
