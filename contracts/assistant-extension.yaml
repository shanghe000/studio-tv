                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Live tv.access denied",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Object missing or inaccessible to this owner",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable; retryable, access fails closed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "412": {
            "description": "VERSION_CONFLICT with CURRENT_REVISION detail",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "428": {
            "description": "IF_MATCH_REQUIRED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "201": {
            "description": "Persisted USER Message plus conversationRevision; first write and replay both201. ETag is receipt conversationRevision, which can be older than current revision on replay. Fetch conversation detail to get current ETag. Server supplies id, seq, role=USER, createdAt. No model invocation/assistant reply/usage.",
            "headers": {
              "ETag": {
                "description": "Strong receipt conversation revision, including on replay.",
                "schema": {
                  "type": "string",
                  "pattern": "^\"[1-9][0-9]*\"$"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MessageReceiptResponse"
                }
              }
            }
          },
          "409": {
            "description": "IDEMPOTENCY_CONFLICT: same owner/key with different content, conversationId or frozen expectedRevision; ASSISTANT_TASK_ACTIVE when a persisted conversation task is QUEUED/RUNNING. New USER append is rejected atomically to preserve turn boundaries.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Body exceeds the shared 1 MiB JSON limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "Content-Type must be application/json",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "501": {
            "description": "Unsupported STRUCTURED schema or message-parts repository not implemented. Production verifies actual owned READY ASSET and exact selected skill revision/content.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "x-required-capability": "tv.access",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MessageCreate"
              }
            }
          }
        }
      }
