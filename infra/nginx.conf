map $uri $studiotv_access_route {
    ~^/api/v1/ "api/v1";
    ~^/api/v2/ "api/v2";
    ~^/storage/ "storage";
    ~^/project/canvas/ "canvas";
    ~^/projects(?:/|$) "projects";
    ~^/guide(?:/|$) "guide";
    ~^/(?:assets|project/assets|_nuxt|brand)/ "static";
    /runtime-config.js "runtime-config";
    / "root";
    default "unmatched";
}
map $http_upgrade $studiotv_connection {
    default upgrade;
    "" "";
}
map $upstream_http_x_request_id $studiotv_request_id {
    "" $request_id;
    default $upstream_http_x_request_id;
}
log_format studiotv escape=json '{"time":"$time_iso8601","service":"studiotv-web","log_id":"$studiotv_request_id","method":"$request_method","route":"$studiotv_access_route","status":$status,"bytes":$body_bytes_sent,"elapsed_seconds":$request_time,"upstream_seconds":"$upstream_response_time","upstream_status":"$upstream_status"}';
server {
    listen 80;
    server_name _;
    # Directory redirects must retain the browser's externally published port.
    absolute_redirect off;
    access_log /var/log/nginx/access.log studiotv;
    # Stock error messages include the unsanitized request URI and signed grants.
    # Gateway failures are recorded above with status, timing and correlation ID.
    error_log /dev/null;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 513m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Compression is enabled only by static script/style locations below.
    # API responses, signed media, documents and runtime configuration stay plain.
    gzip off;
    gzip_static off;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/javascript text/css;
    location ~ ^/(?:api/v[12]|storage)/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $studiotv_connection;
        proxy_cache off;
        gzip off;
        gzip_static off;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    # Standalone documentation must stay current and never fall back to the SPA.
    location ^~ /guide/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }
    location = /media-worker.js {
        gzip on;
        gzip_static on;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed /;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    # Documents and unversioned identity assets must revalidate after releases.
    # Only content-fingerprinted scripts/styles may skip release revalidation.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location = /favicon.svg {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location ^~ /brand/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location ~* "^/(?:assets|project/assets)/[^/]+-[a-z0-9_-]{8,}\.(?:js|css)$" {
        gzip on;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location ~* \.(?:js|css)$ {
        gzip on;
        gzip_static on;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location ~* \.(?:woff2?|ttf|otf|png|jpe?g|webp|svg|ico)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
